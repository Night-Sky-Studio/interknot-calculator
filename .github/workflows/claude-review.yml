name: Claude Review

# Automatic review when a PR is opened or marked ready. Claude is read-only here:
# it can comment on the PR and open YouTrack issues, but the token it gets cannot
# push, commit or edit files. Ask for a re-review with "@claude review" (claude.yml).

on:
  pull_request:
    types: [ opened, ready_for_review, reopened ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch asd-ste100 skill
        uses: actions/checkout@v6
        with:
          repository: danyuchn/asd-ste100-skill
          ref: 32511c6992ecb5f1971e46a2943f2e6adceedafe # v0.4.0
          path: .claude/skills/asd-ste100
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@v1
        env:
          YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow token (scoped above) instead of the Claude GitHub App,
          # whose installation token would carry Contents: write.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .github/claude/review-rules.md and follow it.

            Review this pull request.
            - Post line-specific findings as inline comments.
            - Post one top-level summary with `gh pr comment`.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Skill,Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(.github/scripts/youtrack.sh:*),Bash(python3 .claude/skills/asd-ste100/scripts/ste-lint.py:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git commit:*),Bash(git push:*)"
