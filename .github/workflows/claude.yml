name: Claude

# Responds to @claude mentions on pull requests: questions, re-reviews, and
# "file this in YouTrack". Read-only: the token it gets cannot push, commit or
# edit files. Only users with write access to the repo can trigger it.

on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude:
    # PR conversations only: on plain issues the action would try to create a
    # working branch, which this token is not allowed to do.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch asd-ste100 skill
        uses: actions/checkout@v6
        with:
          repository: danyuchn/asd-ste100-skill
          ref: 32511c6992ecb5f1971e46a2943f2e6adceedafe # v0.4.0
          path: .claude/skills/asd-ste100
          persist-credentials: false

      - name: Respond
        uses: anthropics/claude-code-action@v1
        env:
          YOUTRACK_TOKEN: ${{ secrets.YOUTRACK_TOKEN }}
          PR_URL: ${{ github.event.issue.pull_request.html_url || github.event.pull_request.html_url }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --append-system-prompt "Read .github/claude/review-rules.md and follow it. If asked to review, review the whole PR and post findings as inline comments. If asked to file something in YouTrack, use .github/scripts/youtrack.sh and reply with the issue link."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Skill,Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(.github/scripts/youtrack.sh:*),Bash(python3 .claude/skills/asd-ste100/scripts/ste-lint.py:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git commit:*),Bash(git push:*)"
